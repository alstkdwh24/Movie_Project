<body>
<!-- 카카오톡 구성: 상단 제목줄 / 가운데 목록 / 하단 탭. 목록·대화는 js/modal/chat_modal.js 가 그린다 -->
<div th:fragment="chat" class="chat_modals">
    <div class="modal_modal" role="dialog" aria-modal="true" aria-labelledby="chat-title">
        <div class="chat_body">
            <header class="chat_head">
                <h2 id="chat-title" class="chat_title">채팅</h2>
                <button type="button" class="chat_modal_button" aria-label="채팅 닫기">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"></path></svg>
                </button>
            </header>

            <div class="chat_center">
                <section class="chat_panel" data-panel="friends">
                    <div class="chat_search">
                        <input type="search" maxlength="20" placeholder="친구 이름 검색" aria-label="친구 검색">
                    </div>
                    <div class="chat_friends_list"></div>
                </section>
                <section class="chat_panel" data-panel="rooms">
                    <button type="button" class="chat_new" aria-expanded="false">
                        <span class="chat_new_icon" aria-hidden="true">+</span>새 채팅방 만들기
                    </button>
                    <form class="chat_create" autocomplete="off" hidden>
                        <label for="chat-room-name">채팅방 이름</label>
                        <input id="chat-room-name" type="text" maxlength="30" placeholder="예) 어벤져스 같이 볼 사람">
                        <button type="submit" class="chat_create_submit">만들기</button>
                        <p class="chat_create_hint">지금은 화면에서만 만들어지며, 서버에는 저장되지 않습니다.</p>
                    </form>
                    <div class="chat_rooms_list"></div>
                </section>
                <section class="chat_panel" data-panel="movie"></section>
                <section class="chat_panel" data-panel="more">
                    <div class="chat_more_body"></div>
                </section>
            </div>

            <nav class="chat_tabs" aria-label="채팅 메뉴">
                <button type="button" class="chat_tab" data-tab="friends">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"></path></svg>
                    <span>친구목록</span>
                </button>
                <button type="button" class="chat_tab" data-tab="rooms">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v12H9l-5 4Z"></path></svg>
                    <span>채팅방</span>
                </button>
                <button type="button" class="chat_tab" data-tab="movie">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 9h18M8 5v4M13 5v4M18 5v4"></path></svg>
                    <span>영화채팅방</span>
                </button>
                <button type="button" class="chat_tab" data-tab="more">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.2"></circle><circle cx="12" cy="12" r="1.2"></circle><circle cx="19" cy="12" r="1.2"></circle></svg>
                    <span>기타</span>
                </button>
            </nav>
        </div>

        <!-- 채팅방 화면: 채팅방 목록의 방을 누르면 열린다 -->
        <div class="chat_room" hidden role="dialog" aria-modal="true" aria-label="채팅방">
            <header class="chat_room_head">
                <button type="button" class="chat_room_back" aria-label="채팅방 목록으로">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
                </button>
                <h2 class="chat_room_title"></h2>
                <button type="button" class="chat_room_more" aria-label="채팅방 메뉴" aria-haspopup="true" aria-expanded="false">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.2"></circle><circle cx="12" cy="12" r="1.2"></circle><circle cx="12" cy="19" r="1.2"></circle></svg>
                </button>
            </header>
            <div class="chat_room_menu" role="menu" hidden>
                <button type="button" role="menuitem" data-action="mute"></button>
                <button type="button" role="menuitem" data-action="pin"></button>
                <button type="button" role="menuitem" data-action="block">차단하기</button>
                <button type="button" role="menuitem" data-action="leave" class="is-danger">채팅방 나가기</button>
            </div>
            <div class="chat_messages" aria-live="polite"></div>
            <form class="chat_input" autocomplete="off">
                <input type="text" maxlength="500" placeholder="메시지를 입력하세요" aria-label="메시지 입력">
                <button type="submit" class="chat_send">전송</button>
            </form>
            <p class="chat_room_notice">서버에 연결되지 않아 이 화면에서만 표시됩니다.</p>
        </div>

        <!-- 친구 프로필: 친구 목록의 친구를 누르면 열린다 -->
        <div class="chat_profile" hidden role="dialog" aria-modal="true" aria-label="친구 프로필">
            <div class="chat_profile_top">
                <button type="button" class="chat_profile_fav" aria-label="즐겨찾기" aria-pressed="false">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9Z"></path></svg>
                </button>
                <button type="button" class="chat_profile_close" aria-label="프로필 닫기">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"></path></svg>
                </button>
            </div>
            <div class="chat_profile_main">
                <div class="chat_profile_avatar chat_avatar"></div>
                <strong class="chat_profile_name"></strong>
                <span class="chat_profile_status"></span>
            </div>
            <div class="chat_profile_actions">
                <button type="button" class="chat_profile_chat">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v12H9l-5 4Z"></path></svg>
                    <span>채팅하기</span>
                </button>
                <button type="button" class="chat_profile_block">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M6.3 6.3l11.4 11.4"></path></svg>
                    <span>차단하기</span>
                </button>
            </div>
        </div>
    </div>
</div>
</body>
