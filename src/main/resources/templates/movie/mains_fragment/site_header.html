<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header(isMain)" class="jcgx-header">
    <link rel="stylesheet" href="/css/jcgx-header.css?v=20261030-1">
    <div class="jcgx-header-inner">
        <div class="jcgx-header-top">
            <a class="jcgx-brand" href="/movie/mains" aria-label="JCGX 홈">JCGX<span>CINEMA &amp; CULTURE</span></a>
            <nav class="jcgx-account" aria-label="회원 메뉴">
                <a th:if="${userSession == null}" href="/movie/login/login">로그인</a>
                <a th:if="${userSession != null}" href="/movie/login/logout">로그아웃</a>
                <button th:if="${userSession == null}" type="button" th:id="${isMain ? 'join_Modal' : 'sub_join'}">회원가입</button>
                <a th:if="${userSession != null}" href="/movie/user/Mypage">마이페이지</a>
                <a href="/movie/chats/Question">문의</a>
            </nav>
        </div>
        <div class="jcgx-header-bottom">
            <nav class="jcgx-navigation" aria-label="주 메뉴">
                <a href="https://pedia.watcha.com/ko-KR/">영화정보</a>
                <button type="button" class="jcgx-community" th:classappend="${isMain ? 'community' : 'con'}">커뮤니티</button>
                <a href="/movie/Reservation/reservation">예매</a>
                <a href="/movie/community/event">이벤트</a>
                <a href="/movie/shops/popcorn_store">스토어</a>
                <button th:if="${roles == 'ROLE_ADMIN' and isMain}" type="button" onclick="movie_modal_resist(event)">글등록</button>
                <button th:if="${roles == 'ROLE_ADMIN' and !isMain}" type="button" id="iPlus_menu">글등록</button>
            </nav>
            <div class="jcgx-tools" aria-label="빠른 메뉴">
                <a href="/movie/mains" aria-label="홈"><svg id="menus" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10 12 3l9 7v11h-6v-8H9v8H3Z"/></svg></a>
                <button type="button" class="momo_button" id="modal_modal" aria-label="검색"><svg id="menulogin" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="7"/><path d="m16 16 6 6"/></svg></button>
                <div id="menu1"><button type="button" class="modalOpenButton" aria-label="채팅"><svg id="menutwo" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h18v15H8l-5 4Z"/></svg></button></div>
                <button type="button" id="menu" aria-label="전체 메뉴"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 5h20M2 12h20M2 19h20"/></svg></button>
            </div>
        </div>
    </div>
</header>
<!-- 모바일 하단 탭바(CGV·롯데시네마 방식). header 밖에 둬야 position:fixed가 뷰포트 기준으로 동작한다 -->
<nav th:fragment="tabbar" class="cinema-tabbar" aria-label="하단 메뉴">
    <a href="/movie/mains"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10 12 3l9 7v11h-6v-8H9v8H3Z"/></svg><span>홈</span></a>
    <a href="/movie/community/event"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16v4H4zM6 12v8h12v-8M12 8v12M12 8c-2 0-4-1-3-3 1-1.5 3 0 3 3 0-3 2-4.500 3-3 1 2-1 3-3 3Z"/></svg><span>이벤트</span></a>
    <a class="cinema-tabbar-book" href="/movie/Reservation/reservation"><span>예매</span></a>
    <a href="/movie/shops/popcorn_store"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1 12H6zM9 8a3 3 0 0 1 6 0"/></svg><span>스토어</span></a>
    <a href="/movie/chats/Question"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h18v15H8l-5 4Z"/></svg><span>문의</span></a>
</nav>
</body>
</html>
