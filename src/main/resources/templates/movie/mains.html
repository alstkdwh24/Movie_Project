    </div>

<main id="main-content">
<nav class="cinema-quick" aria-label="빠른 메뉴">
    <a href="/movie/Reservation/reservation"><strong>빠른 예매</strong><span>영화·시간·좌석 선택</span></a>
    <a href="/movie/community/event"><strong>이벤트</strong><span>진행 중인 혜택</span></a>
    <a href="/movie/shops/popcorn_store"><strong>스토어</strong><span>팝콘·관람권·기프트</span></a>

</nav>
<section aria-labelledby="now-showing-title">
    <div class="movie_list">
        <div class="cinema-heading">
            <div><p class="cinema-eyebrow">NOW SHOWING</p><h1 id="now-showing-title">오늘, 어떤 영화를 볼까요?</h1></div>
            <a class="cinema-link" href="/movie/Reservation/reservation">빠른 예매 <span aria-hidden="true">↗</span></a>
        </div>
        <div class="movie_title">
            <div class="sort">
                <button type="button" class="watch_movie" id="moving">현재 상영작</button>
                <button type="button" class="watch_movie" id="movie_watch">상영 예정작</button>
            </div>
        </div>
        <div class="movie_title_ex" th:utext="${movieHtml}">
            <!--            <div class="movie_picture" th:each="vo, status:${movie_list}">-->

            <!--                <div class="movie_image">-->
            <!--                    <div class="movie_real_image">-->

            <!--                    </div>-->
            <!--                </div>-->
            <!--                <div class="movie_gle">[[${vo.movie_title}]]</div>-->

            <!--            </div>-->

        </div>
        <p class="cinema-empty" th:if="${#lists.isEmpty(movie_list)}">현재 상영 중인 영화가 없습니다. 상영 일정이 등록되면 이곳에 표시됩니다.</p>

    </div>
    <div class="secrete_div" th:each="vo : ${movie_list}">
        <div id="title">
            [[${vo.movie_title}]]
        </div>
        <div class="integer">
            [[${vo.movie_integer}]]
        </div>
        <div id="filePath">
            [[${vo.filePath}]]
        </div>
        <div id="movie_filename">
            [[${vo.movie_filename}]]
        </div>
        <div class="uuid">
            [[${vo.uuid}]]
        </div>

        <h3 th:text="${vo.movie_title}">Movie Title</h3>
    </div>

</section>

<script>


    let resist_modal = document.querySelector(".resist_black");
    let resist_modal_top = document.getElementById("resist_modal_top")

    function movie_modal_resist(event) {
        resist_modal.style.display = "flex"; // 선택한 요소의 display 속성을 'flex'로 설정하여 보이게 합니다.
        console.log("나옵니다. 모달만 만들면 되요.")


    }

    resist_modal_top.onclick = function (event) {
        resist_modal.style.display = "none";
    }

    resist_modal.onclick = function (event) {
        if (resist_modal && event.target === resist_modal) {
            resist_modal.style.display = "none";
        }

    }

</script>
