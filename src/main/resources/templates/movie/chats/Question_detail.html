<body>

<!--소메뉴 div-->
<div th:replace="movie/sub_menu-fragment/sub_menu_fragment :: article_divs"></div>
<form name="g_delete" method="get" action="" class="input">

    <div class="free_detail">

        <div class="user_name">
            <div id="title" th:value="${vo.q_title}"><h2 id="h2_titles" style="color: red; padding: 0;">문의사항</h2><h2 style="color: grey; padding:10px;" >[[${vo.q_title}]]</h2></div>
            <div id="user_id">
<!--                <div id="user_img"></div>-->
                <div id="free_feature">
                    <div id="name" th:value="${vo.nickname}">[[${vo.nickname}]]</div>
                    <div id="free_impormation">
                        <div class="small_box" ><p>글번호 : </p><p id="gallery_name">[[${vo.Q_number}]]</p></div>
                        <div class="small_box" id="date">[[${vo.Q_write_time}]]</div>
                        <div class="small_box" id="count">조회수 : [[${vo.Q_count}]]</div>
                    </div>
                </div>
            </div>

        </div>
        <div class="free_contents" th:value="${vo.Q_content}">
            [[${vo.Q_content}]]

        </div>
        <div class="coment">
            <div id="comment_dox">
                <div class="talk">
<!--                    <div id="talk_img">-->
<!--                        <input type="image" alt="" id="input_img">-->

<!--                    </div>-->
                    <input type="hidden" name="Q_number" th:value="${userSession.username}" id="QNumber">

                    <div id="talk_contents">
<!--                        <div id="talk_contents_title">-->
<!--                            <div class="Question_comment_title">-->
<!--                                <div class="Question_id">닉네임</div>-->
                                <input type="hidden" class="Question_id"></input>
                                <input type="hidden" id="QNumbers">

<!--                            </div>-->
<!--                            <div class="Question_comment_title">-->
<!--                                <div class="Question_id">글쓴날짜</div>-->
                                <input type="hidden" class="Question_id"></input>
<!--                            </div>-->
<!--                        </div>-->
                        <div id="talk_contents_content">
                            <label id="idss"><textarea id="textareas"></textarea></label>
                            <button id="Question_comment_two">댓글등록</button>
                        </div>
                        <div id="notice">
                        </div>
                    </div>
                </div>
                <div id="comment_two"></div>
            </div>

            <div id="botton_buttom">
                <div id="buttom_two" th:if="${vo.username} == ${userSession.username}">
                    <button id="talk_button_update"
                    >
                        수정
                    </button>
                    <button id="talk_button_cancel">삭제</button>
                </div>
            </div>

        </div>


    </div>
</form>

<!--커뮤니티 div-->
<div th:replace="movie/community/fragment_gallery_modal :: mains_menu_modal"></div>

<!--채팅 div-->
<div th:replace="movie/mains_fragment/modal/mains_chat_modal :: chat"></div>

<!--커뮤니티 모달-->

<!--소메뉴 검색  div-->

</div>
<!--미니 메뉴 div-->
<div th:replace="movie/mains_fragment/modal/mini_main_modal :: sneak_peeks"></div>

<!--채팅 js-->

<script>


    let resist_modal = document.querySelector(".resist_black");
    let resist_modal_top = document.getElementById("resist_modal_top")

    function movie_modal_resist(event) {
        resist_modal.style.display = "flex"; // 선택한 요소의 display 속성을 'flex'로 설정하여 보이게 합니다.
        console.log("나옵니다. 모달만 만들면 되요.")


    }

    resist_modal_top.onclick = function (event) {
        resist_modal.style.display = "none";
    }

    resist_modal.onclick = function (event) {
        if (resist_modal && event.target === resist_modal) {
            resist_modal.style.display = "none";
        }

    }

</script>

</body>
</html>
