<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@40,400,0,0"/>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!--    보드형태 유지를 위한 것-->

    <!--글 등록 모달-->
    <link rel="stylesheet" href="/css/resist_contents/resist_modal.css">

    <!--    미니메뉴 모달-->
    <link rel="stylesheet" href="/css/mains/main_imin_menu.css">

    <!--    조인 모달-->
    <link rel="stylesheet" href="/css/login/join_modal/join_modal.css">

    <!--    토큰 조인 모달-->

<!--소메뉴 css-->

    <link rel="stylesheet" href="/css/login/login(menu).css">
    <link rel="stylesheet" href="/css/login/login.css">
<!--소메뉴 html크기-->

    <!--보드혈태 유지하기 위한 css    -->
    <link rel="stylesheet" href="/css/event/free_board_writer.css">

<!--    커뮤니티css-->

    <link rel="stylesheet" href="/css/mains/modal/fragment_gallery_modal.css">

<!--    커뮤니티 제목 유지하기 위한 css-->
    <link rel="stylesheet" href="/css/mains/modal/menu_modal.css">

<!--    소메뉴 검색-->

</head>
<body>
<!--소제목 div-->
<div th:replace="movie/sub_menu-fragment/sub_menu_fragment :: article_divs"></div>
<form method="Post" name="Gallery_g_board" action="/" class="big_frame">
    <input type="hidden" name="g_number" th:value="${vo.g_number}">
    <div class="big_div">
        <div class="big_gallery_title"><h2 class="title_big">G-WRITE</h2></div>
        <div class="blank">
            <div class="f-write_title"><h2 class="title_word">글제목</h2></div>
            <div class="title_inputs">
                <label>
                    <input type="text" class="title_input" name="g_title" th:value="${vo.g_title}" >
                </label>
            </div>
        </div>
        <div class="blank"></div>
        <div class="big_content">
            <label>
                <textarea class="content_big_input" name="g_contents"  th:value="${vo.g_contents}">[[${vo.g_contents}]]</textarea>
            </label>
        </div>
        <div class="blank"></div>
        <div class="big_content_file"></div>
        <div class="writer_button">
            <div class="button_bottom">
                <button class="bottom_submit">SUBMIT</button>
                <button class="bottom_close">CLOSE</button>
            </div>
        </div>


    </div>

</form>

<!--커뮤니티 div-->
<div th:replace="movie/community/fragment_gallery_modal :: mains_menu_modal"></div>

<!--커뮤니티 모달-->
<div th:replace="movie/write_resist/resist_modal :: resist_fragment"></div>

<!--채팅 css-->
<div th:replace="movie/mains_fragment/modal/mains_chat_modal :: chat"></div>

<!--소제목 검색 css-->
<div th:replace="movie/mains_fragment/modal/mains_search_modal :: mains_search_modal"></div>

<!--미니 메뉴 div-->
<div th:replace="movie/mains_fragment/modal/mini_main_modal :: sneak_peeks"></div>

<div th:replace="movie/login/joinModal/joinModal :: joinModal"></div>
<div th:replace="movie/login/joinModal/realJoin :: realJoin"></div>


<!--커뮤니티js-->
<script src="/js/modal/Gallery_modal2.js"></script>

<!--소제목 검색js-->
<script src="/js/modal/momo_modal.js"></script>

<!--소제목 채팅js-->
<script src="/js/modal/chat_modal.js"></script>

<!--공지사함 데이터-->
<script src="/js/data/g_board_writer.js"></script>

<!--자유게시판 데이터-->
<script src="/js/data/freeboard.js"></script>

<!--미니 메뉴-->
<script src="/js/modal/menu_modal.js"></script>

<!--글등록 모달-->
<script src="/js/resist_image_file/resist_modal.js"></script>

<script src="/js/login/join_modal/join_modal.js"></script>

<!--조인모달-->
<script src="/js/login/join_modal/join_sub.js"></script>
<script>


    let resist_modal = document.querySelector(".resist_black");
    let resist_modal_top = document.getElementById("resist_modal_top")

    function movie_modal_resist(event) {
        resist_modal.style.display = "flex"; // 선택한 요소의 display 속성을 'flex'로 설정하여 보이게 합니다.
        console.log("나옵니다. 모달만 만들면 되요.")


    }

    resist_modal_top.onclick = function (event) {
        resist_modal.style.display = "none";
    }

    resist_modal.onclick = function (event) {
        if (resist_modal && event.target === resist_modal) {
            resist_modal.style.display = "none";
        }

    }

</script>

<!--공지사항 수정한거 업데이트-->
<script src="/js/data/event/g_board_writer_update.js"></script>
</body>
</html>
