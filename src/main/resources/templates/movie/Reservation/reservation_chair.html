    <!--글 등록 모달-->

    <!--소메뉴 검색 css-->

    <!--채팅 css-->

    <!--커뮤니티 모달 css-->

    <!--이페이지 css-->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>좌석 선택 | JCGX</title>
    <link rel="stylesheet" href="/css/cinema-theme.css?v=20261111-15">
</head>
<body>
<!--소메뉴 div-->
<!--<div th:replace="/movie/sub_menu-fragment/sub_menu_fragment.html :: article_divs"></div>-->
<div th:fragment="reservation" id="reservation_two">
    <div id="reservation_modal_content_two">
        <div id="reservation_board_two">
            <div class="movie_chair">
                <img src="/movie/img/free-icon-movie-theater-4362681.png" alt="" width="100%" height="100%"
                     style="box-sizing: border-box;">
            </div>
            <input type="hidden" name="movieTitle" id="movieTitleInput">
            <input type="hidden" name="moviePlace" id="moviePlaceInput">
            <input type="hidden" name="movieTime" id="movieTimeInput">
            <input type="hidden" name="movie_Seat" id="chair_value">
            <input type="hidden" name="username_modal" id="username_modal" th:value="${userSession.username}">


            <div class="movie_chair_sheet3" role="group" aria-label="좌석 선택">
                <div class="movie_sheet_number" th:each="row : ${#strings.arraySplit('A,B,C,D,E', ',')}">
                    <span class="seat_row_label" th:text="${row}" aria-hidden="true"></span>
                    <div class="chair" th:each="n : ${#numbers.sequence(1, 10)}"
                         th:attr="value=${row + '-' + n}">
                        <img src="/css/img/icon/free-icon-cinema-seat-4222064.png" alt="">
                        <h3 class="main_image_text" th:text="${row + '-' + n}">A-1</h3>
                    </div>
                </div>
                <input type="hidden" value="1000" id="reservation_price">
                <input type="hidden" id="paymentId">
            </div>
        </div>
        <ul class="seat_legend" aria-label="좌석 상태 안내">
            <li><i class="seat_legend_dot"></i>선택 가능</li>
            <li><i class="seat_legend_dot is-selected"></i>선택한 좌석</li>
            <li><i class="seat_legend_dot is-taken"></i>예약 완료</li>
        </ul>
        <button id="seat_resist">다음</button>
    </div>
</div>
<!--채팅 모달div-->
<div th:replace="movie/mains_fragment/modal/mains_chat_modal :: chat"></div>
<!--소메뉴 검색css-->
<div th:replace="movie/mains_fragment/modal/mains_search_modal :: mains_search_modal"></div>
<!--커뮤니티div-->
<div th:replace="movie/community/fragment_gallery_modal :: mains_menu_modal"></div>
<!--미니 메뉴 div-->
<div th:replace="movie/mains_fragment/modal/mini_main_modal :: sneak_peeks"></div>

<!--예약모달-->
<div th:replace="movie/Reservation/reservation_modal :: reservation_modal"></div>
<!--커뮤니티 모달-->
<div th:replace="movie/write_resist/resist_modal :: resist_fragment"></div>

<!--예약 모달-->
<div th:replace="movie/Reservation/reservation_modal :: reservation_modal"></div>

<div th:replace="movie/login/joinModal/joinModal :: joinModal"></div>
<div th:replace="movie/login/joinModal/realJoin :: realJoin"></div>

<!--미니 메뉴-->

<!--좌석예매 js-->

</html>
